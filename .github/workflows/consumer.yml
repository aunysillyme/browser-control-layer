{
  "name": "Packed consumers",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "consumers-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "pack": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Select Node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Pack once",
          "run": "mkdir packed\nnpm pack --pack-destination packed --ignore-scripts"
        },
        {
          "name": "Upload shared tarball",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "consumer-tarball",
            "path": "packed/*.tgz",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "consumers": {
      "needs": [
        "pack"
      ],
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 10,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-latest",
            "macos-latest",
            "windows-latest"
          ]
        }
      },
      "steps": [
        {
          "name": "Check out source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Select Node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Download the packed tarball",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "consumer-tarball",
            "path": "packed"
          }
        },
        {
          "name": "Install and exercise the packed consumer",
          "run": "node .github/scripts/consumer.mjs"
        }
      ]
    }
  }
}
