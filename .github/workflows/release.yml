{
  "name": "release",
  "on": {
    "push": {
      "tags": [
        "v*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "release-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "publish": {
      "name": "Publish the tagged version to npm with provenance",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "steps": [
        {
          "name": "Check out the tag (checkout v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Select the publishing runtime (setup-node v7.0.0)",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24",
            "registry-url": "https://registry.npmjs.org"
          }
        },
        {
          "name": "Trusted publishing needs npm 11.5.1 or newer",
          "run": "npm install -g npm@latest\nnpm --version"
        },
        {
          "name": "The tag and package.json must name the same version",
          "run": "tag=\"${GITHUB_REF_NAME#v}\"\npkg=\"$(node -p \"require('./package.json').version\")\"\ntest \"$tag\" = \"$pkg\" || { echo \"tag v$tag but package.json is $pkg\"; exit 1; }"
        },
        {
          "name": "Release checks",
          "run": "node scripts/check.mjs --release\nnode --test"
        },
        {
          "name": "Pack and publish the verified tarball",
          "run": "set -eu\ntarball=\"$(npm pack --silent)\"\nnpm publish \"$tarball\" --provenance --access public"
        }
      ]
    }
  }
}
