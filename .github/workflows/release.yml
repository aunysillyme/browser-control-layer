{
  "name": "release",
  "on": {
    "push": {
      "tags": [
        "v*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "release-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "publish": {
      "name": "Publish the tagged version to npm with provenance",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "steps": [
        {
          "name": "Check out the tag (checkout v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Select the publishing runtime (setup-node v7.0.0)",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24",
            "registry-url": "https://registry.npmjs.org"
          }
        },
        {
          "name": "Trusted publishing needs npm 11.5.1 or newer",
          "run": "npm install -g npm@latest\nnpm --version"
        },
        {
          "name": "The tag and package.json must name the same version",
          "run": "tag=\"${GITHUB_REF_NAME#v}\"\npkg=\"$(node -p \"require('./package.json').version\")\"\ntest \"$tag\" = \"$pkg\" || { echo \"tag v$tag but package.json is $pkg\"; exit 1; }"
        },
        {
          "name": "Release checks",
          "run": "node scripts/check.mjs --release\nnode --test"
        },
        {
          "name": "Download the tested tarball",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "consumer-tarball",
            "path": "packed"
          }
        },
        {
          "name": "Publish the consumer-tested tarball",
          "run": "node --input-type=module -e 'import {readdirSync} from \"node:fs\"; import {execFileSync} from \"node:child_process\"; const files=readdirSync(\"packed\").filter(name=>name.endsWith(\".tgz\")); if(files.length!==1) throw Error(\"Expected one tested tarball\"); execFileSync(\"npm\",[\"publish\",\"packed/\"+files[0],\"--provenance\",\"--access\",\"public\"],{stdio:\"inherit\"});'"
        }
      ],
      "needs": [
        "consumers"
      ]
    },
    "pack": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Select Node",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Pack once",
          "run": "mkdir packed\nnpm pack --pack-destination packed --ignore-scripts"
        },
        {
          "name": "Upload shared tarball",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "consumer-tarball",
            "path": "packed/*.tgz",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "consumers": {
      "needs": [
        "pack"
      ],
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 10,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-latest",
            "macos-latest",
            "windows-latest"
          ]
        }
      },
      "steps": [
        {
          "name": "Check out source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Select Node",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Download the packed tarball",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "consumer-tarball",
            "path": "packed"
          }
        },
        {
          "name": "Install and exercise the packed consumer",
          "run": "node .github/scripts/consumer.mjs"
        }
      ]
    }
  }
}
